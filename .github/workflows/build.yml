name: build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

jobs:
  test-and-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ledremote-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-apk:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "════════════════════════════════════════════"
          echo "ДІАГНОСТИКА СЕКРЕТІВ"
          echo "════════════════════════════════════════════"
          echo "Довжина KEYSTORE_BASE64 (символів): ${#KEYSTORE_BASE64}"
          echo "Перші 80 символів KEYSTORE_BASE64:"
          echo "${KEYSTORE_BASE64:0:80}"
          echo ""
          echo "Довжина STORE_PASSWORD: ${#STORE_PASSWORD}"
          echo "Довжина KEY_ALIAS: ${#KEY_ALIAS}"
          echo "Довжина KEY_PASSWORD: ${#KEY_PASSWORD}"
          echo ""

          # Якщо довжина 0 - це головна проблема
          if [ ${#KEYSTORE_BASE64} -eq 0 ]; then
            echo "❌ КРИТИЧНА ПОМИЛКА: Секрет KEYSTORE_BASE64 порожній!"
            echo "👉 Перейдіть у Settings → Secrets and variables → Actions і перевірте секрети."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/app"

          # Очищуємо від усіх можливих "сміттєвих" символів
          # tr видаляє переноси, пробіли, таби
          # grep -v видаляє рядки з заголовками PEM (якщо вони є)
          echo "$KEYSTORE_BASE64" | tr -d '\n\r\t ' | base64 -d > "$GITHUB_WORKSPACE/app/release.keystore" 2>/tmp/base64_error.txt

          if [ -s /tmp/base64_error.txt ]; then
            echo "⚠️ Помилка base64 декодування:"
            cat /tmp/base64_error.txt
          fi

          echo ""
          echo "════════════════════════════════════════════"
          echo "ПЕРЕВІРКА СТВОРЕНОГО ФАЙЛУ"
          echo "════════════════════════════════════════════"
          ls -la "$GITHUB_WORKSPACE/app/release.keystore"
          echo "Розмір у байтах:"
          wc -c "$GITHUB_WORKSPACE/app/release.keystore"
          echo "Тип файлу:"
          file "$GITHUB_WORKSPACE/app/release.keystore"
          echo "Перші 4 байти (магічне число Java Keystore):"
          xxd "$GITHUB_WORKSPACE/app/release.keystore" | head -1

          if [ ! -s "$GITHUB_WORKSPACE/app/release.keystore" ]; then
            echo "❌ ПОМИЛКА: Файл порожній!"
            exit 1
          fi

          # Записуємо keystore.properties у 3 місця для надійності
          for DIR in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/app"; do
            {
              echo "storeFile=$GITHUB_WORKSPACE/app/release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > "$DIR/keystore.properties"
          done

          echo ""
          echo "════════════════════════════════════════════"
          echo "ВМІСТ keystore.properties"
          echo "════════════════════════════════════════════"
          cat "$GITHUB_WORKSPACE/keystore.properties"

          echo ""
          echo "════════════════════════════════════════════"
          echo "ПОШУК УСІХ release.keystore В WORKSPACE"
          echo "════════════════════════════════════════════"
          find "$GITHUB_WORKSPACE" -name "release.keystore" -exec ls -la {} \;

      - name: Verify keystore before build
        run: |
          echo "Перевірка перед збіркою:"
          ls -la "${{ github.workspace }}/app/release.keystore"
          echo "PWD під час перевірки: $(pwd)"
          echo "Поточний вміст папки app:"
          ls -la "${{ github.workspace }}/app/"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Attach APK to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
