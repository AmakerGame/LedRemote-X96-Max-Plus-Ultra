name: build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

jobs:
  test-and-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ledremote-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-apk:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Створюємо папку app, якщо її раптом немає
          mkdir -p "$GITHUB_WORKSPACE/app"
          
          # 2. Декодуємо ключ, очищуючи його від переносів рядків та пробілів (часта причина помилок)
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$GITHUB_WORKSPACE/app/release.keystore"
          
          # 3. Перевіряємо, чи файл створився і чи він не порожній
          if [ ! -s "$GITHUB_WORKSPACE/app/release.keystore" ]; then
            echo "ПОМИЛКА: Файл release.keystore порожній або не створений! Перевірте правильність секрету KEYSTORE_BASE64."
            exit 1
          fi
          
          # 4. Записуємо файл властивостей у корінь проєкту
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$GITHUB_WORKSPACE/keystore.properties"
          
          # 5. Копіюємо файл властивостей також у папку app (про всяк випадок, якщо Gradle шукає його там)
          cp "$GITHUB_WORKSPACE/keystore.properties" "$GITHUB_WORKSPACE/app/keystore.properties"
          
          # 6. Виводимо діагностичну інформацію в логи
          echo "--- Вміст keystore.properties ---"
          cat "$GITHUB_WORKSPACE/keystore.properties"
          echo "--- Файли в папці app ---"
          ls -la "$GITHUB_WORKSPACE/app/"
      - name: Build signed release APK
        run: ./gradlew assembleRelease
      - name: Attach APK to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
